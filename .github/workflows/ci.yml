name: CI

# `main` is trunk. `release` is what users install: it is the branch an
# unpinned clone lands on, so it is covered here as well as trunk.
#
# A merge into `release` re-runs the whole suite rather than trusting the trunk
# run that preceded it. Three reasons, and none of them is caution:
#
#   - the repository ruleset requires the status check named `test` on the
#     default branch, and the default branch is to become `release`. A required
#     check that never runs on the branch it is required for is not a check
#     being trusted, it is a merge that can never go green.
#   - `tests/test_release.sh` has a half that only executes on `release` — that
#     the version the manifests declare is one some tag names. A trunk run
#     cannot assert it, because on trunk it is deliberately false.
#   - the merge result is a tree, and if `release` has ever diverged from the
#     commit trunk tested, it is a tree no run has seen.
on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, in full. tests/test_release.sh decides whether `release`
          # carries a released version by asking whether a tag names this
          # commit; under the default shallow, tagless checkout it would read
          # "not fetched" as "never released" and fail every release merge. The
          # suite refuses to reach a verdict without tags rather than guessing,
          # so this is what keeps that precondition true.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install skill-validator
        run: |
          curl -sSL https://github.com/agent-ecosystem/skill-validator/releases/download/v1.6.1/skill-validator_1.6.1_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin skill-validator
          skill-validator --version
      - name: Install skillscore
        run: npm install -g skillscore@2.0.2
      # First, because the suites below are only worth running if their substrate
      # can report a failure. This checks that every suite is on the shared
      # harness, that none of them can reach a verdict without saying so, that no
      # assertion in any of them is incapable of failing, and that the suites in
      # tests/ are exactly the ones named in this file and in the README — a
      # suite CI never runs reports nothing, and neither does one a reader is
      # never told to run. It counts them from this file rather than carrying a
      # number of its own, so adding a suite below is all that adding a suite
      # takes.
      - name: Run verification-harness tests
        run: tests/test_harness.sh
      - name: Run skill layout tests
        run: tests/test_skill.sh
      - name: Run documented install-route tests
        run: tests/test_install.sh
      - name: Run end-to-end walk tests
        run: tests/test_walk.sh
      - name: Run skill-rewrite drafter and documentation tests
        run: tests/test_rewrite.sh
      - name: Run F01 format/policy separation tests
        run: tests/test_f01.sh
      - name: Run F02 unified audit report tests
        run: tests/test_f02.sh
      # The release pointer: that every manifest agrees on the version, that no
      # marketplace entry advertises or pins something the plugin does not
      # install, and — on `release` only — that the version it carries is one a
      # tag names. Nothing in CI validated a manifest before this step, and the
      # drift it refuses is invisible to `claude plugin validate --strict`.
      - name: Run release-pointer tests
        run: tests/test_release.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: profiler/go.mod
          # The profiler module has no dependencies and so no go.sum. setup-go
          # caches on a go.sum hash and warns on every run when it finds none.
          cache: false
      # The same four commands the release checklist runs locally. A diff that
      # adds a parser and claims vet, gofmt and the race detector were run has
      # to be a diff CI would have caught if they had not been.
      - name: Check profiler formatting
        run: |
          cd profiler
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Build and vet the profiler
        run: cd profiler && go build ./... && go vet ./...
      - name: Run profiler tests
        run: cd profiler && go test -race -count=1 ./...
